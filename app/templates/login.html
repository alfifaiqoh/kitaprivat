<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KITA PRIVAT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-edu-blue min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Kita Privat" class="h-12 mx-auto mb-2">
            <h1 class="text-xl sm:text-2xl font-bold text-edu-blue">KITA PRIVAT</h1>
            <p class="text-gray-500 text-xs sm:text-sm">Masuk ke akun Anda</p>
        </div>
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-xs sm:text-sm">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-xs sm:text-sm font-semibold mb-1 sm:mb-2">Username</label>
                <input type="text" name="username" required
                    class="w-full px-3 sm:px-4 py-2 sm:py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-edu-blue">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-xs sm:text-sm font-semibold mb-1 sm:mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3 sm:px-4 py-2 sm:py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-edu-blue">
            </div>
            <button type="submit"
                class="w-full bg-edu-blue text-white py-2.5 sm:py-3 rounded-lg hover:bg-blue-800 transition font-semibold text-sm sm:text-base">
                Masuk
            </button>
        </form>
        <div class="text-center mt-4 text-xs sm:text-sm text-gray-500">
            <p>Demo: <strong>admin</strong> / <strong>admin123</strong></p>
        </div>
    </div>
</body>
</html>
