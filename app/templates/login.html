<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KITA PRIVAT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #3C2420, #0D3A81);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .login-logo img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .login-logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #3C2420;
      margin: 0 0 4px 0;
    }
    .login-logo p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #0D3A81;
      box-shadow: 0 0 0 3px rgba(13,58,129,0.1);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #0D3A81;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background: #0A2C61;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='images/logo-kita-privat.png') }}" alt="KITA PRIVAT">
      <h1>KITA PRIVAT</h1>
      <p>Sistem Manajemen Les Privat</p>
    </div>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-login">Masuk</button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 KITA PRIVAT</p>
    </div>
  </div>
</body>
</html>
