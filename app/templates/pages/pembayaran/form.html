{% extends 'base.html' %}
{% block title %}{{ 'Edit' if pembayaran else 'Tambah' }} Pembayaran - KITA PRIVAT{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow p-6">
    <h1 class="text-2xl font-bold text-edu-blue mb-4">{{ 'Edit' if pembayaran else 'Tambah' }} Pembayaran</h1>
    <form method="POST">
        <div class="mb-3">
            <label class="block text-sm font-semibold mb-1">Penugasan <span class="text-red-500">*</span></label>
            <select name="penugasan_id" required class="w-full border rounded-lg px-3 py-2">
                <option value="">Pilih Penugasan</option>
                {% for p in penugasan_list %}
                <option value="{{ p.id }}" {{ 'selected' if pembayaran and pembayaran.penugasan_id == p.id }}>{{ p.siswa.nama }} - {{ p.mata_pelajaran }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label class="block text-sm font-semibold mb-1">Jumlah (Rp) <span class="text-red-500">*</span></label>
                <input type="number" name="jumlah" value="{{ pembayaran.jumlah if pembayaran else '' }}" step="1000" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Bulan <span class="text-red-500">*</span></label>
                <input type="month" name="bulan" value="{{ pembayaran.bulan if pembayaran else '' }}" required class="w-full border rounded-lg px-3 py-2">
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label class="block text-sm font-semibold mb-1">Status</label>
                <select name="status" class="w-full border rounded-lg px-3 py-2">
                    <option value="belum_dibayar" {{ 'selected' if pembayaran and pembayaran.status == 'belum_dibayar' }}>Belum Dibayar</option>
                    <option value="lunas" {{ 'selected' if pembayaran and pembayaran.status == 'lunas' }}>Lunas</option>
                    <option value="tertunda" {{ 'selected' if pembayaran and pembayaran.status == 'tertunda' }}>Tertunda</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Metode</label>
                <input type="text" name="metode" value="{{ pembayaran.metode if pembayaran else '' }}" class="w-full border rounded-lg px-3 py-2">
            </div>
        </div>
        <div class="mb-3">
            <label class="block text-sm font-semibold mb-1">Tanggal Bayar</label>
            <input type="date" name="tanggal_bayar" value="{{ pembayaran.tanggal_bayar if pembayaran else '' }}" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-semibold mb-1">Keterangan</label>
            <textarea name="keterangan" rows="2" class="w-full border rounded-lg px-3 py-2">{{ pembayaran.keterangan if pembayaran else '' }}</textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-edu-blue text-white px-6 py-2 rounded-lg hover:bg-blue-800">Simpan</button>
            <a href="{{ url_for('pembayaran.index') }}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
