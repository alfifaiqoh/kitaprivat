{% extends 'base.html' %}
{% block title %}Profil Saya - KITA PRIVAT{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-xl sm:text-2xl font-bold text-edu-blue mb-4">Profil Saya</h1>
    <div class="bg-white rounded-xl shadow p-4 sm:p-6">
        <form method="POST" class="space-y-3 sm:space-y-4">
            <div>
                <label class="block text-xs sm:text-sm font-semibold mb-1">Nama Lengkap <span class="text-red-500">*</span></label>
                <input type="text" name="nama" value="{{ tutor.user.nama }}" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-edu-blue">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs sm:text-sm font-semibold mb-1">Email</label>
                    <input type="email" name="email" value="{{ tutor.user.email or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-semibold mb-1">Telepon</label>
                    <input type="text" name="telepon" value="{{ tutor.user.telepon or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs sm:text-sm font-semibold mb-1">Password <span class="text-gray-400">(kosongkan jika tidak diubah)</span></label>
                <input type="password" name="password" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <hr class="border-gray-200">
            <div>
                <label class="block text-xs sm:text-sm font-semibold mb-1">Bidang</label>
                <input type="text" name="bidang" value="{{ tutor.bidang or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs sm:text-sm font-semibold mb-1">Pendidikan</label>
                <input type="text" name="pendidikan" value="{{ tutor.pendidikan or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-xs sm:text-sm font-semibold mb-1">Pengalaman</label>
                <textarea name="pengalaman" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm">{{ tutor.pengalaman or '' }}</textarea>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 pt-2">
                <button type="submit" class="bg-edu-blue text-white px-6 py-2 rounded-lg hover:bg-blue-800 text-sm w-full sm:w-auto">Simpan</button>
                <a href="{{ url_for('dashboard.index') }}" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400 text-sm text-center w-full sm:w-auto">Kembali</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
