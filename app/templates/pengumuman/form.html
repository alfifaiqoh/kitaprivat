{% extends 'base.html' %}
{% block title %}Tambah Pengumuman - KITA PRIVAT{% endblock %}
{% block content %}
<div class="mb-6">
    <h1 class="text-2xl font-bold text-edu-blue">Tambah Pengumuman</h1>
</div>

<div class="bg-white rounded-xl shadow p-6 max-w-2xl">
    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Judul</label>
            <input type="text" name="judul" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Isi</label>
            <textarea name="isi" rows="5" required class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Target</label>
            <select name="target" class="w-full px-3 py-2 border rounded-lg text-sm">
                <option value="semua">Semua</option>
                <option value="tutor">Tutor</option>
                <option value="orang_tua">Orang Tua</option>
            </select>
        </div>
        <button type="submit" class="bg-edu-blue text-white px-6 py-2 rounded-lg font-semibold">Simpan</button>
    </form>
</div>
{% endblock %}
